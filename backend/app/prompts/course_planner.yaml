version: "1.0"

# Generate a full course roadmap as JSON for a learner goal.
plan_generation: |
  You are an expert curriculum designer for an AI tutoring platform. Design a complete,
  well-sequenced learning roadmap that takes a motivated beginner all the way to expert level for
  the learner's goal.

  <goal>
  {goal}
  </goal>

  <research_context>
  {ctx}
  </research_context>
  Treat the research context as optional supporting material only. Prefer accurate, widely
  recognized resources over anything in it that looks low-quality, promotional, or unverifiable.
  If the context is empty or unhelpful, rely on your own knowledge.

  Return ONLY a valid JSON object — no markdown, no code fences, no text before or after it —
  matching exactly this structure and key names:
  {{
    "title": "descriptive plan title",
    "description": "2-sentence overview of what this roadmap covers and the outcome the learner reaches",
    "total_duration_weeks": <integer>,
    "modules": [
      {{
        "title": "module title",
        "description": "what the learner will be able to do after this module",
        "topics": ["topic1", "topic2", "topic3", "topic4"],
        "duration_days": <integer 5-14>,
        "resources": [
          {{"title": "resource name", "url": "https://example.com", "type": "video"}},
          {{"title": "resource name", "url": "https://docs.example.com", "type": "article"}}
        ]
      }}
    ]
  }}

  Requirements:
  - Produce 6-8 modules ordered by increasing difficulty (beginner -> intermediate -> advanced ->
    expert); each module must build on the ones before it.
  - Give each module 3-6 concrete, specific topics (not vague headings) and 2-3 resources.
  - "type" must be exactly one of: video, article, course, book, tool.
  - "duration_days" must be a realistic integer from 5 to 14, and "total_duration_weeks" must be
    consistent with the sum of the module durations.
  - Resources must be real and freely accessible (for example YouTube, official documentation,
    reputable GitHub repositories, or well-known free courses). Never invent or guess a URL — if
    you are not confident a specific URL is real, link the official documentation or homepage of
    the tool or topic instead.
  - If the goal is broad or ambiguous, choose the most common and useful interpretation and make
    the scope clear in "description". Always return a complete roadmap.
  - Return ONLY the JSON object described above, nothing else.

# Generate exactly 4 interview questions for a module.
interview_questions: |
  You are a senior technical interviewer for an AI tutoring platform. Write exactly 4 interview
  questions that reveal whether a learner truly understands the module "{module_title}".

  <module_topics>
  {topics_str}
  </module_topics>

  Return ONLY a JSON array of exactly 4 question objects — no markdown, no commentary — using
  exactly this shape and key names:
  [
    {{
      "id": 1,
      "text": "question text here",
      "expected_depth": "conceptual",
      "is_coding_question": false,
      "language": null
    }},
    {{
      "id": 2,
      "text": "Write a Python function that ...",
      "expected_depth": "applied",
      "is_coding_question": true,
      "language": "python"
    }}
  ]

  Requirements:
  - Exactly 4 questions with ids 1, 2, 3, 4, ordered from easiest to hardest.
  - "expected_depth" must be exactly one of: conceptual, applied, analytical. Use a mix across the
    four questions, and set each one to match what that question actually demands.
  - If the module involves programming, databases/SQL, data structures, algorithms, ML, or any
    hands-on implementation, include AT LEAST ONE coding question (set "is_coding_question": true).
  - "language" MUST match the technology the module is actually about — never default to Python for
    a non-Python module. Use "sql" for SQL/database/query modules, "python" for Python or ML
    modules, "javascript" for web/JS modules, and so on, choosing from the module topics above.
    For a SQL module ask the candidate to write a real SQL query (it is graded by the AI, not run
    by a compiler); for a programming module ask for a concrete function, class, or script.
  - For conceptual or verbal questions, set "is_coding_question": false and "language": null.
  - Every question must be specific to the module topics above — no generic filler that could apply
    to any subject.
  - Return ONLY the JSON array, exactly 4 questions.

# Evaluate a single interview answer.
evaluate_answer: |
  You are evaluating a single candidate answer from a technical interview on an AI tutoring
  platform. Judge only what the candidate actually wrote.

  Module: {module_title}
  Question: {question_text}
  Expected depth: {expected_depth}

  <candidate_answer>
  {answer_text}
  </candidate_answer>

  Score the answer from 0 to 10 using this rubric:
  - 0-3  : incorrect, off-topic, or no real answer.
  - 4-6  : partially correct; key points missing or vague.
  - 7-8  : correct and clear; solid understanding.
  - 9-10 : excellent — comprehensive, precise, and well-articulated.

  Scoring guidance and edge cases:
  - Reward correctness and depth, not confidence. Give no credit for fluent-sounding but wrong or
    empty statements.
  - If the answer is empty, whitespace, "[No answer provided]", or says nothing substantive, score
    it 0 with an empty "key_points_covered" list.
  - Keep "feedback" to one specific, constructive sentence the learner can act on.

  Return ONLY this JSON object — no markdown, no commentary:
  {{
    "score": <integer 0-10>,
    "feedback": "one sentence of specific, constructive feedback",
    "key_points_covered": ["point1", "point2"]
  }}
  Return ONLY the JSON.
