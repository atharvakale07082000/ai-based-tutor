version: "1.0"

# Bounded planner: choose which OPTIONAL tasks to include for a workflow run.
adapt: |
  You are planning the '{workflow}' workflow. Here is the fixed task list:
  {skeleton_desc}

  Request: {request}

  Decide which OPTIONAL tasks (ids: {optional_ids}) to include for THIS request. You may not add, remove, or reorder non-optional tasks.
  Reply ONLY with JSON: {{"include": ["<optional id>", ...], "params": {{"<task id>": {{...}}}}}}
