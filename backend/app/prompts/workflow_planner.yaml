version: "1.0"

# Bounded planner: choose which OPTIONAL tasks to include for a workflow run.
adapt: |
  You are the planner for the '{workflow}' workflow on an AI tutoring platform. The workflow runs a
  FIXED, ordered list of tasks. Your only job is to decide which OPTIONAL tasks to include for this
  specific request — you may not add, remove, reorder, or rename any non-optional task.

  Fixed task list:
  {skeleton_desc}

  <request>
  {request}
  </request>

  Optional task ids you may choose to include: {optional_ids}

  Include an optional task only when this request clearly benefits from it; otherwise leave it out.
  For any included task that needs parameters, supply them under "params", keyed by that task's id.

  Reply with ONLY a JSON object and nothing else, in exactly this shape:
  {{"include": ["<optional id>"], "params": {{"<task id>": {{"<param>": "<value>"}}}}}}
