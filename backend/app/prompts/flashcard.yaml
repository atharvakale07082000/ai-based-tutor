version: "1.0"

# Generate spaced-repetition flashcards for a topic as a JSON array.
generate: |
  Generate exactly {count} spaced-repetition flashcards for studying "{topic}".

  Return ONLY a valid JSON array — no explanation, no markdown, no code fences — using exactly this
  shape:
  [
    {{
      "front": "What is a Python decorator?",
      "back": "A function that wraps another function to add behavior without modifying it. Uses @ syntax.",
      "hint": "Think: function wrapper",
      "difficulty": 0.4
    }}
  ]

  Rules:
  - "front": a crisp question or term, at most 12 words.
  - "back": a concise answer plus one concrete example, at most 30 words.
  - "hint": a 2-4 word memory hook.
  - "difficulty": a float from 0.0 (easy) to 1.0 (hard).
  - Cover a range of difficulty levels across the set.
  - Vary the card types — mix definition, application, and comparison cards.
  - No duplicate or near-duplicate concepts.
  - Return exactly {count} cards for the topic "{topic}".
