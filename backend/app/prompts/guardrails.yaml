version: "1.0"

input:
  max_length: 2000
  min_length: 3
  # Prompt-injection / jailbreak patterns (case-insensitive substring match)
  blocked_patterns:
    - "ignore previous instructions"
    - "ignore all instructions"
    - "disregard your system prompt"
    - "forget everything"
    - "you are now"
    - "act as if"
    - "pretend you are"
    - "jailbreak"
    - "prompt injection"
    - "DAN mode"
    - "developer mode"
  # Regexes (case-insensitive) that tolerate filler words the substring list misses,
  # e.g. "ignore ALL PREVIOUS instructions", "reveal YOUR system prompt".
  blocked_regexes:
    - "ignore\\s+(?:\\w+\\s+){0,3}?instructions"
    - "disregard\\s+(?:\\w+\\s+){0,3}?(?:instructions|system\\s+prompt)"
    - "forget\\s+(?:\\w+\\s+){0,3}?(?:everything|instructions|context)"
    - "(?:reveal|show|print|repeat|expose)\\s+(?:\\w+\\s+){0,3}?(?:system\\s+prompt|instructions)"
    - "(?:you\\s+are\\s+now|act\\s+as\\s+if|pretend\\s+(?:you\\s+are|to\\s+be))"

output:
  min_length: 10
  # Max before we truncate / warn (not hard-block — model rarely exceeds this)
  max_length: 8000

quiz:
  required_fields:
    - question
    - options
    - correct_index
    - explanation
    - bloom_level
  min_option_count: 4
  # correct_index must be in [0, 3]
  valid_correct_index_range: [0, 3]
  min_question_length: 10

# Topic moderation for generation entry points (course goal, quiz topic, curriculum goal).
# Atelier is an educational platform for professional/technical skills, so off-domain,
# explicit, or vague "topics" must be rejected before any generation runs. Terms are matched
# on WORD BOUNDARIES (so "assignment" is never flagged for "ass", etc.).
topic:
  min_length: 3
  # Every word being vague ⇒ reject (e.g. "stuff", "random things"); a real skill token spares it.
  vague_terms:
    - stuff
    - things
    - thing
    - whatever
    - random
    - anything
    - something
    - idk
    - dunno
    - test
    - testing
    - asdf
    - qwerty
    - none
    - na
  # Explicit / off-domain content an educational-jobs platform should never build a course for.
  blocked_terms:
    - porn
    - pornography
    - sex
    - nude
    - nudes
    - nudity
    - xxx
    - nsfw
    - erotica
    - erotic
    - fetish
    - escort
    - hentai
    - onlyfans
    - cocaine
    - heroin
    - meth
    - methamphetamine
    - "how to make a bomb"
    - bomb making
    - explosives
    - suicide
    - "self harm"
    - "self-harm"
