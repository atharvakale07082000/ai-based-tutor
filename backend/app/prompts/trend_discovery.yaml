version: "1.0"

# Distill recent search results into a fixed number of trending learning subtopics.
distill: |
  You are a tech curriculum expert. Below are recent web search results about trending IT topics.
  Distill them into concrete, learnable subtopics for an AI tutoring platform.

  Extract exactly {target_topics} distinct, actionable learning subtopics that are in high demand
  right now, drawn from across these domains:
  Data Engineering, DevOps, Cloud Computing, Machine Learning, Deep Learning, Data Science,
  Cybersecurity, AI Engineering, Software Engineering.

  <search_results>
  {snippets}
  </search_results>

  Return ONLY a valid JSON array — no explanation, no markdown — using exactly this shape:
  [
    {{"domain": "Data Engineering", "subtopic": "Apache Kafka Streams", "description": "Real-time stream processing with the Kafka Streams API"}}
  ]

  Rules:
  - "domain" must be one of the nine domains listed above.
  - Each "subtopic" must be a specific, learnable skill or technology — not a vague category.
  - Write a one-line, concrete "description" of what the subtopic covers.
  - No duplicate subtopics, and prioritize skills with high current industry demand.
  - Return exactly {target_topics} items.
