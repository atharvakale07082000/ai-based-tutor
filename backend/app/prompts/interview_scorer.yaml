version: "1.0"

# Node 1 — analyze each candidate answer for correctness and depth.
analyze_answers: |
  You are a senior technical interviewer assessing a candidate's answers for the module
  "{module_title}".

  <module_topics>
  {topics}
  </module_topics>

  Below are the interview questions with the candidate's answers. For EACH question, judge the
  answer on factual correctness and conceptual depth, based ONLY on what the candidate actually
  wrote. Treat "[No answer provided]", empty text, or a non-answer as incorrect with no concepts
  addressed. Do not reward confident wording that is factually wrong.

  <questions_and_answers>
  {qa_block}
  </questions_and_answers>

  Return ONLY a JSON array with exactly one object per question above, in the SAME order — no
  markdown, no commentary:
  [
    {{
      "question_id": <same integer id as shown in [Qx]>,
      "correctness": "correct|partial|incorrect",
      "concepts_addressed": ["concept1", "concept2"],
      "key_gaps": ["gap1", "gap2"],
      "depth_achieved": "surface|adequate|deep"
    }}
  ]
  Rules:
  - "correctness" must be exactly one of: correct, partial, incorrect.
  - "depth_achieved" must be exactly one of: surface, adequate, deep.
  - For an incorrect or empty answer, use "concepts_addressed": [] and "depth_achieved": "surface".
  - Keep the array the same length and order as the questions.
  Return ONLY the JSON array.

# Node 2 — turn the analysis into numeric scores.
scoring_matrix: |
  You are scoring interview answers for the module "{module_title}". Below is a per-question
  analysis of what the candidate got right and wrong:

  <analysis>
  {analyses_text}
  </analysis>

  Assign each question an integer score from 0 to 10 using this rubric:
  - 0-3  : incorrect, missing, or off-topic.
  - 4-6  : partially correct; key points missing.
  - 7-8  : good understanding demonstrated.
  - 9-10 : excellent, comprehensive, and well-articulated.

  Keep every score consistent with the analysis: "incorrect" or "surface" answers score low;
  "correct" or "deep" answers score high. Produce exactly one object per question, in the same
  order as the analysis.

  Return ONLY a JSON array with one object per question — no markdown, no commentary:
  [
    {{
      "question_id": <id>,
      "score": <integer 0-10>,
      "justification": "one clear sentence explaining the score",
      "concepts_covered": ["c1", "c2"],
      "concepts_missed": ["m1", "m2"]
    }}
  ]
  Return ONLY the JSON array.

# Node 3 — two-sentence holistic summary.
final_summary: |
  Here is the scored interview performance for the module "{module_title}":

  <scoring_matrix>
  {matrix_json}
  </scoring_matrix>

  Average score: {avg}/10

  Write exactly two sentences of feedback addressed to the candidate:
  1. The first sentence names one specific thing the candidate did well.
  2. The second sentence names the single most important area to improve.
  Ground both sentences in the scoring matrix above, and be specific and constructive. If the
  average is very low, stay encouraging while being honest about the main gap.
  Return ONLY the two sentences — no preamble, no bullet points, no score, no JSON.
