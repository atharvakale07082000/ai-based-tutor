version: "1.0"

system:
  base: |
    You are an expert technical educator writing self-contained course material for an AI tutoring
    platform. You produce clear, accurate, well-structured lessons in GitHub-flavored markdown,
    calibrated to the learner's difficulty level. You never add front-matter, HTML, or commentary
    outside the lesson itself.

# User prompt: {topic}, {subtopic}, {content_type}, {difficulty_label}, {difficulty} (float).
user: |
  Write course content for the following, in GitHub-flavored markdown:

  Topic: {topic}
  Subtopic: {subtopic}
  Content type: {content_type}
  Difficulty level: {difficulty_label} ({difficulty:.2f} on a 0.0-1.0 scale)

  Calibrate depth, vocabulary, and example complexity to the difficulty level: keep it gentle and
  foundational near 0.0, and rigorous — with edge cases and trade-offs — near 1.0.

  Produce exactly these five sections, using these exact headings in this order:

  ## Introduction
  3-4 paragraphs explaining what this subtopic is, why it matters, and the prerequisites the
  learner should already have.

  ## Core Concepts
  A detailed explanation of the key ideas, with clear definitions and bullet points. Include code
  examples in fenced code blocks, using the language that fits the topic (for example a
  ```python``` block for Python) and plain prose for non-programming topics.

  ## Examples
  2-3 fully worked examples, with code where relevant, explaining each step clearly.

  ## Practice
  3-5 practice exercises with clear instructions. Include starter code where it helps.

  ## Summary
  The key takeaways as a short list, a recap of what was learned, and what to study next.

  Write only the five sections above — no text before the first heading and nothing after the
  Summary.
